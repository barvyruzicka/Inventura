<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f4fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="BLR App">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>BLR App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&display=swap&subset=latin-ext">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: one narrow phone column; sticky area switcher, live camera strip above the work area, bottom tab bar */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --sunk:#e8eae6; --fg:#1d2420; --muted:#5d6762; --line:#d3d7d2;
  --accent:#1f4fa8; --accent-fg:#ffffff;
  --sklad:#b9851c; --obchod:#1f4fa8; --michr:#a5432a;
  --ok:#2f7a45; --warn:#a86b00; --bad:#b3261e;
  --f-ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-label:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-code:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --area:var(--obchod);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121614; --surface:#1b211e; --sunk:#232a26; --fg:#e6ebe7; --muted:#9aa49f; --line:#323a36;
  --accent:#7ea2ec; --accent-fg:#0d1530; --sklad:#e0aa45; --obchod:#7ea2ec; --michr:#e07a5f;
  --ok:#6cc488; --warn:#e8b14a; --bad:#f2867d; color-scheme:dark}}
body[data-area="SKLAD"]{--area:var(--sklad)} body[data-area="OBCHOD"]{--area:var(--obchod)} body[data-area="MICHARNA"]{--area:var(--michr)}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font:700 22px/1.1 var(--f-label);letter-spacing:.02em;text-transform:uppercase;margin:0}
h2{font:700 17px/1.2 var(--f-label);letter-spacing:.06em;text-transform:uppercase;margin:0;color:var(--muted)}
.who{font-size:13px;color:var(--muted);background:none;border:0;padding:4px 0;cursor:pointer;text-decoration:underline dotted;font-family:inherit}
.areas{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.areas button{font:700 16px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;padding:11px 4px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
.areas button i{width:12px;height:12px;border-radius:3px;display:inline-block}
.areas button[aria-pressed="true"]{border-color:var(--area);background:color-mix(in srgb,var(--area) 14%,var(--surface))}
.banner{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--sunk);color:var(--fg)}
.banner.warn{background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.banner.bad{background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scanrow{display:grid;grid-template-columns:1fr auto;gap:8px}
input[type=text],input[type=search],input[type=url]{font:500 18px/1.2 var(--f-ui);width:100%;padding:12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
input:focus-visible,button:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:1px}
.btn{font:600 16px/1 var(--f-ui);padding:13px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.area{background:var(--area);border-color:var(--area);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.big{padding:18px;font-size:18px;width:100%}
.btn[disabled]{opacity:.5;cursor:default}
.hint{font-size:13px;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.code{font:500 14px/1.3 var(--f-code);color:var(--muted);overflow-wrap:anywhere}
.item-name{font:700 20px/1.2 var(--f-ui);margin:0;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--sunk);border-radius:8px;padding:8px 10px;min-width:0}
.stat b{display:block;font:700 22px/1.1 var(--f-label);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.stat.hl{background:color-mix(in srgb,var(--area) 16%,var(--surface))}
.qty{display:grid;grid-template-columns:56px 1fr 56px;gap:6px}
.qty button{font:700 24px/1 var(--f-ui)}
.qty input{text-align:center;font:700 26px/1 var(--f-label);font-variant-numeric:tabular-nums}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none;color:inherit;font:inherit;cursor:pointer;width:100%}
.li:first-child{border-top:0}
.li .n{font-weight:600;overflow-wrap:anywhere;min-width:0}
.li .q{font:700 19px/1.1 var(--f-label);font-variant-numeric:tabular-nums;text-align:right;align-self:center;grid-row:span 2}
.li .s{font:500 12.5px/1.3 var(--f-code);color:var(--muted);min-width:0;overflow-wrap:anywhere}
.pos{color:var(--ok)} .neg{color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:600 14px/1 var(--f-ui);padding:9px 12px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.areabar{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:14px}
.areabar .dot{width:12px;height:12px;border-radius:3px}
.areabar .num{font:700 17px/1 var(--f-label);font-variant-numeric:tabular-nums;text-align:right}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs button{font:700 15px/1 var(--f-label);letter-spacing:.07em;text-transform:uppercase;padding:16px 4px;background:none;border:0;color:var(--muted);cursor:pointer;border-top:3px solid transparent}
nav.tabs button[aria-current="page"]{color:var(--fg);border-top-color:var(--area)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.flash{animation:flash .6s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--ok) 30%,var(--surface))}to{background:var(--surface)}}
@media (prefers-reduced-motion:reduce){.flash,.cambox.hit{animation:none}}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--area)}
.confirm{border:1.5px solid var(--bad);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;overflow-wrap:anywhere}
ol.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px}
/* camera */
.cambox{position:relative;border-radius:10px;overflow:hidden;background:#000;height:min(34vh,280px);border:3px solid var(--area)}
.cambox video{width:100%;height:100%;object-fit:cover;display:block}
.cambox .guide{position:absolute;left:8%;right:8%;top:50%;height:2px;background:#ff3b30;box-shadow:0 0 8px #ff3b30;opacity:.85}
.cambox .frame{position:absolute;left:5%;right:5%;top:25%;bottom:25%;border:2px solid rgba(255,255,255,.7);border-radius:8px}
.cambox .camtools{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.cambox .camtools button{background:rgba(0,0,0,.55);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:9px 12px;font:600 14px var(--f-ui);cursor:pointer}
.cambox .camres{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;border-radius:8px;padding:8px 10px;font-weight:600;font-size:15px}
.cambox .paused{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);color:#fff;font:700 18px var(--f-label);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;border:0;width:100%}
.cambox.hit{animation:hit .45s ease-out}
@keyframes hit{from{border-color:var(--ok);box-shadow:0 0 0 6px color-mix(in srgb,var(--ok) 50%,transparent)}to{box-shadow:none}}
.back{font:700 15px/1 var(--f-label);letter-spacing:.05em;text-transform:uppercase;background:var(--surface);color:var(--fg);border:1.5px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer}
.top{align-items:center}
h1{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
h1 .logo{width:30px;height:30px;border-radius:6px;background:#fff;flex:none}
.tiles{display:flex;flex-direction:column;gap:10px;min-width:0}
#main>*{min-width:0}
.tile{display:grid;grid-template-columns:52px minmax(0,1fr) auto;min-width:0;gap:14px;align-items:center;text-align:left;width:100%;padding:16px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.tile:hover:not(.soon){border-color:var(--accent)}
.tile .ic{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--surface));color:var(--c)}
.tile .ic svg{width:28px;height:28px}
.tile b{display:block;font:700 21px/1.15 var(--f-label);letter-spacing:.04em;text-transform:uppercase}
.tile small{display:block;font-size:14px;color:var(--muted);margin-top:3px}
.tile .go{font:700 22px/1 var(--f-ui);color:var(--muted)}
.tile.soon{cursor:default;opacity:.62;border-style:dashed}
.tile .tag{display:inline-block;margin-top:6px;font:700 11px/1 var(--f-ui);letter-spacing:.06em;text-transform:uppercase;padding:5px 7px;border-radius:6px;background:var(--sunk);color:var(--muted)}
.stag{display:inline-block;font:700 11px/1 var(--f-ui);letter-spacing:.05em;text-transform:uppercase;padding:4px 6px;border-radius:5px;background:var(--sunk);color:var(--muted);vertical-align:middle}
.stag.zap{background:color-mix(in srgb,var(--warn) 20%,var(--surface));color:var(--fg)}
.stag.obj{background:color-mix(in srgb,var(--accent) 20%,var(--surface));color:var(--fg)}
.stag.dod{background:color-mix(in srgb,var(--ok) 20%,var(--surface));color:var(--fg)}
.supgrid{display:flex;flex-wrap:wrap;gap:6px}
.supgrid .chip{font-size:15px;padding:10px 12px}
.supgrid .chip small{font-size:11px;color:inherit;opacity:.7;margin-left:4px}
.ohead{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.ohead h3{margin:0;font:700 20px/1.1 var(--f-label);letter-spacing:.04em;text-transform:uppercase}
.oacts{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.oacts .btn{padding:10px 12px;font-size:14px}
.li.sel{background:color-mix(in srgb,var(--accent) 8%,var(--surface))}
.ofixbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.ofixbar small{display:block;font:700 13px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.ofixbar b{font:700 22px/1.1 var(--f-label);letter-spacing:.03em;text-transform:uppercase}
.tile.sup{grid-template-columns:minmax(0,1fr) auto;padding:14px}
.ofix{display:flex;flex-direction:column;gap:6px}
.ofix label{font:700 15px/1 var(--f-label);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ofix select{font:600 18px/1.2 var(--f-ui);width:100%;padding:11px 12px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);min-width:0}
.ofix.on select{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font:inherit;text-decoration:underline;cursor:pointer}
.warnbox{font-size:14px;padding:9px 11px;border-radius:8px;background:color-mix(in srgb,var(--warn) 16%,var(--surface))}
.hello{font:700 26px/1.15 var(--f-label);margin:4px 0 0;letter-spacing:.02em}
#qr{align-self:center;background:#fff;padding:10px;border-radius:8px}
@media print{header,#status,.tabs,.noprint,#cambox,.toast{display:none!important}body{background:#fff!important}.printdoc{border:0!important;box-shadow:none!important}}
/* dodací list – A4 */
.dls{background:#fff;color:#111;font:13px/1.35 "Barlow",Arial,sans-serif;padding:16px;border-radius:10px;display:flex;flex-direction:column;gap:12px}
.dls .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dls .logo{width:min(55%,62mm);height:auto}
.dls .doc{text-align:right}
.dls .doc b{display:block;font:700 20px/1.1 "Barlow Condensed",Arial,sans-serif;letter-spacing:.04em}
.dls .doc span{font:700 18px/1.2 "Barlow Condensed",Arial,sans-serif}
.dls .boxes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){.dls .boxes{grid-template-columns:1fr}.dls .doc{text-align:left}}
.dls .box{border:1px solid #999;border-radius:4px;padding:7px 9px}
.dls .box small{display:block;color:#555;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.dls table{width:100%;border-collapse:collapse}
.dls th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;border-bottom:1.5px solid #111;padding:4px}
.dls td{padding:4px;border-bottom:1px solid #ccc;vertical-align:top}
.dls .num{text-align:right;white-space:nowrap}
.dls .sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:6px}
.dls .sig{display:flex;flex-direction:column}
.dls .sigimg{height:34mm;display:flex;align-items:flex-end;justify-content:center;border-bottom:1px solid #111}
.dls .sigimg img{max-height:33mm;max-width:100%}
/* razítko ve skutečné velikosti: šířka cca 56 mm (obrázek 700 × 310 px) – velikost razítka mění height */
.dls .sigimg img.raz{height:25mm;max-height:none;width:auto;max-width:100%}
.dls .sigimg svg{width:100%;height:30mm}
.dls .foot{font-size:10px;color:#666;text-align:center}
.dls.a4{font-size:13.5px}.dls.a4 .boxes{grid-template-columns:1fr 1fr!important}.dls.a4 .doc{text-align:right!important}.dls.a4 .logo{width:235px}
@page{size:A4 portrait;margin:12mm}
@media print{
  body.dlprinting{padding:0!important;margin:0!important}
  body.dlprinting::before{display:none!important}
  body.dlprinting .wrap{max-width:none!important;gap:0!important}
  .dls{padding:0;border-radius:0;font-size:10.5pt}
  .dls .boxes,.dls .sigs{grid-template-columns:1fr 1fr!important}
  .dls .logo{width:62mm}
  .dls .doc b{font-size:20pt}.dls .doc span{font-size:15pt}
  .dls tr{break-inside:avoid}.dls .sigs{break-inside:avoid}
}
#qr img,#qr canvas{display:block}
/* štítky */
body.wide .wrap{max-width:1180px}
body.wide #main{width:100%}
.labgrid{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.labgrid{grid-template-columns:minmax(0,1fr)}}
.labcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.labprev{position:sticky;top:76px}
.labsheet{width:100%;max-width:640px;margin:0 auto;aspect-ratio:210/297;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12),0 6px 18px rgba(0,0,0,.08)}
.labsheet svg{display:block;width:100%;height:100%}
.lablist{display:flex;flex-direction:column;max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.labrow{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.labrow:first-child{border-top:0}
.labrow.off{opacity:.55}
.labrow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.labqty{display:flex;align-items:center;gap:6px}
.labqty .btn{padding:6px 10px;font-size:16px}
.labqty b{min-width:22px;text-align:center;font:700 18px/1 var(--f-label);font-variant-numeric:tabular-nums}
.labname{display:flex;gap:8px;align-items:center}
.labname input{font-size:16px;padding:8px 10px}
.labname input.edited{border-color:var(--ok)}
.labname .linkbtn{font-size:13px;white-space:nowrap}
.labres{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:0 10px}
.labpaste{display:flex;flex-direction:column;gap:8px}
.labpaste textarea{width:100%;font:13px/1.45 var(--f-code);padding:10px;border-radius:8px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical}
.labq{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:150px;height:212px;padding:4px;border:1px solid var(--line);border-radius:8px;background:var(--sunk)}
.labq button{border:1px solid var(--line);border-radius:5px;background:#fff;color:#1d2420;font:600 13px/1.2 var(--f-ui);cursor:pointer;padding:4px}
.labq button[aria-pressed="true"]{background:repeating-linear-gradient(135deg,#e6e3dc 0 6px,#f3f1ec 6px 12px);color:#8f8a80;text-decoration:line-through}
#labPrint{display:none}
@page lab{size:A4 portrait;margin:0}
@media print{
  body.labprinting{padding:0!important;margin:0!important;background:#fff!important}
  body.labprinting::before,body.labprinting>.wrap,body.labprinting>nav,body.labprinting>.toast{display:none!important}
  body.labprinting #labPrint{display:block}
  .lpage{page:lab;width:210mm;height:297mm;overflow:hidden;break-after:page}
  .lpage:last-child{break-after:auto}
  .lpage svg{display:block;width:210mm;height:297mm}
}
</style>
</head>
<body data-area="OBCHOD">
<div class="wrap">
  <header>
    <div class="top">
      <button class="back" id="homeBtn" type="button" hidden aria-label="Zpět do menu">‹ Menu</button>
      <h1 id="appTitle"><img src="icon-192.png" alt="" class="logo" id="appLogo">BLR App</h1>
      <button class="who" id="whoBtn" type="button"><span id="whoName">nepřihlášen</span></button>
    </div>
    <div class="areas" id="areas" role="group" aria-label="Úsek"></div>
  </header>
  <div id="status" class="wrap"></div>
  <section class="cambox" id="cambox" hidden>
    <video id="video" playsinline muted autoplay></video>
    <div class="frame"></div><div class="guide"></div>
    <div class="camtools"><button type="button" id="torchBtn" hidden>Světlo</button><button type="button" id="camStop">Zavřít</button></div>
    <div class="camres" id="camres">Namiřte na čárový kód</div>
    <button class="paused" id="camPaused" type="button" hidden>Klepněte pro další skenování</button>
  </section>
  <main id="main" class="wrap"></main>
</div>
<nav class="tabs" id="tabs" aria-label="Sekce"></nav>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
const AREAS=[{id:"SKLAD",label:"Sklad",c:"--sklad"},{id:"OBCHOD",label:"Obchod",c:"--obchod"},{id:"MICHARNA",label:"Míchárna",c:"--michr"}];
const AREA_LABEL=Object.fromEntries(AREAS.map(a=>[a.id,a.label]));
function modFromHash(){const h=location.hash;return h==="#inventura"?"inventura":h==="#objednavky"?"objednavky":h==="#dodaci"?"dodaci":h==="#stitky"?"stitky":"home"}
const store={get(k,d){try{const v=localStorage.getItem("inv."+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem("inv."+k,JSON.stringify(v))}catch(e){}}};

/* ---------- connection settings (from the link) ---------- */
const URLP=new URLSearchParams(location.search);
let API=URLP.get("api")||store.get("api","");
let KEY=URLP.get("k")||store.get("k","");
if(URLP.get("api")){store.set("api",API);store.set("k",KEY)}

const S={
  module:modFromHash(), dview:"new", dstep:"items", dfilt:"wait", dsel:null, dconf:null, dq:"", dprint:null, dl:{rows:[],use:{},loaded:false}, odb:store.get("odb",null)||{rows:[],loaded:false,t:0}, oview:"add", ofilt:"zap", osel:null, oconf:null, ord:{sup:[],rows:[],map:{},loaded:false}, osup:null, ounit:"ks", ofix:"", ochange:false, view:"scan", area:store.get("area","OBCHOD"), name:(store.get("user",null)||{}).name||"", pin:(store.get("user",null)||{}).pin||"", fast:store.get("fast",false),
  people:null, loginName:"", loginMode:"pick", loginMsg:"", newPin:null,
  dev:store.get("dev",null),
  conn:API?"connecting":"none", lastOk:0,
  gen:store.get("gen",null), since:0, agg:new Map(), seen:new Set(),
  pending:store.get("pending",[]),
  catState:"loading", catalog:[], byCode:new Map(), byCislo:new Map(),
  cam:false, current:null, choices:null, results:null, notFound:null, query:"",
  ovFilter:"diff", ovArea:"ALL", ovQuery:"", editName:false,
};
if(!S.dev){S.dev=Math.random().toString(36).slice(2,8);store.set("dev",S.dev)}
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s??"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase().trim();
const fmt=n=>{n=Math.round(n*1000)/1000;return n.toLocaleString("cs-CZ")};
const parseQ=v=>{const n=parseFloat(String(v).replace(",",".").replace(/\s/g,""));return isFinite(n)?n:NaN};
let toastT;function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2200)}
function savePending(){store.set("pending",S.pending)}

/* ---------- server ---------- */
async function apiGet(params){
  const u=API+(API.includes("?")?"&":"?")+new URLSearchParams(Object.assign({k:KEY},params));
  const r=await fetch(u,{cache:"no-store"}); return r.json();
}
async function apiPost(body){
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(Object.assign({k:KEY},body))});
  return r.json();
}
function connOk(){if(S.conn!=="ok"){S.conn="ok";renderStatus()}S.lastOk=Date.now()}
function connFail(res){
  const was=S.conn;
  if(res&&res.err==="key")S.conn="key"; else S.conn="offline";
  if(was!==S.conn)renderStatus();
}
function newGen(gen){
  if(S.gen&&S.gen!==gen){toast("Začala nová inventura");}
  if(S.gen!==gen){S.pending=[];savePending();S.agg=new Map();S.seen=new Set();S.since=0;S.gen=gen;store.set("gen",gen);S.current=null;render()}
}

/* ---------- catalog ---------- */
function setCatalog(rows){
  S.catalog=rows; S.byCode=new Map(); S.byCislo=new Map();
  rows.forEach((r,i)=>{
    const [n,ean,cis]=r;
    if(cis&&!S.byCislo.has(cis))S.byCislo.set(cis,i);
    for(const k of [ean,cis]){if(!k)continue;const key=String(k).trim().toLowerCase();const a=S.byCode.get(key);if(a){if(!a.includes(i))a.push(i)}else S.byCode.set(key,[i])}
    r._n=norm(n+" "+cis+" "+(ean||""));
  });
}
async function loadCatalog(){
  const cached=store.get("catalog",null);
  if(cached&&!S.catalog.length){setCatalog(cached);S.catState="cached";render()}
  try{
    const res=await apiGet({a:"catalog"});
    if(!res.ok){connFail(res);if(res.err&&res.err!=="key")S.catError=res.err;render();return}
    connOk(); newGen(res.gen);
    setCatalog(res.rows); S.catState=res.rows.length?"ok":"empty"; S.catError=null; S.catAt=res.at||""; S.catLocked=!!res.locked; S.admins=res.admins||[]; S.inv=res.inv||null;
    store.set("catalog",res.rows.map(r=>r.slice(0,7)));
  }catch(e){connFail();if(!S.catalog.length)S.catState="error"}
  render();
}
function lookupCode(code){
  const c=String(code).trim().toLowerCase(); if(!c)return [];
  const tries=[c]; if(/^\d+$/.test(c)){tries.push("0"+c);if(c.startsWith("0"))tries.push(c.slice(1))}
  for(const t of tries){const a=S.byCode.get(t);if(a)return a}
  return [];
}
const SEARCH_MAX=500; /* kolik nejvýš ukázat výsledků hledání podle názvu */
const foundTxt=n=>n>=SEARCH_MAX?SEARCH_MAX+"+ (upřesněte hledání)":n;
function searchText(q){
  const toks=norm(q).split(/\s+/).filter(Boolean); if(!toks.length)return [];
  const out=[]; for(let i=0;i<S.catalog.length&&out.length<SEARCH_MAX;i++){const r=S.catalog[i];if(toks.every(t=>r._n.includes(t)))out.push(i)}
  return out;
}
const itemRow=key=>{const i=S.byCislo.get(key);return i==null?null:S.catalog[i]};
const itemName=key=>{const r=itemRow(key);return r?r[0]:key};

/* ---------- counts: server log + pending entries ---------- */
const pkey=n=>norm(n||"?").replace(/\s+/g," ");
function applyEntry(map,e){
  const id=e.area+"~"+pkey(e.name); let o=map.get(id);
  if(!o){o={area:e.area,name:"",items:{}};map.set(id,o)}
  if(e.name)o.name=e.name;
  const it=o.items[e.cis]||(o.items[e.cis]={q:0,t:0});
  it.q=Math.round((it.q+e.d)*1000)/1000; if(e.t>it.t)it.t=e.t;
  if(e.cis.startsWith("?")){if(e.nm)it.n=e.nm;if(e.note)it.c=e.note}
}
let pollBusy=false;
async function poll(){
  if(!API||pollBusy)return; pollBusy=true;
  try{
    const res=await apiGet({a:"log",since:S.since});
    if(!res.ok){connFail(res);return}
    connOk();
    if(res.gen!==S.gen){newGen(res.gen);pollBusy=false;return poll()}
    if(res.reset){S.agg=new Map();S.seen=new Set();S.since=0;pollBusy=false;return poll()}
    if(res.rows.length){
      for(const r of res.rows){const [t,area,name,cis,d,dev,id,note,nm]=r;applyEntry(S.agg,{t,area,name,cis,d,dev,note,nm});if(id)S.seen.add(id)}
      S.since=res.n;
      const before=S.pending.length; S.pending=S.pending.filter(p=>!S.seen.has(p.id)); if(S.pending.length!==before)savePending();
      render();
    } else S.since=res.n;
  }catch(e){connFail()}
  finally{pollBusy=false}
}
let flushBusy=false;
async function flush(){
  if(!API||flushBusy)return;
  const now=Date.now();
  if(!S.name||!S.pin)return;
  const batch=S.pending.filter(p=>p.name===S.name&&!S.seen.has(p.id)&&(!p.sent||now-p.sent>30000)).slice(0,40);
  if(!batch.length)return;
  flushBusy=true;
  try{
    const res=await apiPost({a:"add",gen:S.gen,name:S.name,pin:S.pin,entries:batch.map(({sent,...e})=>e)});
    if(!res.ok){if(res.err==="pin"){logout("PIN už neplatí. Přihlaste se znovu, nic se neztratilo.");return}connFail(res);return}
    connOk();
    if(res.stale){newGen(res.gen);render();return}
    const ok=new Set(res.saved); S.pending.forEach(p=>{if(ok.has(p.id))p.sent=Date.now()}); savePending();
    flushBusy=false; poll();
  }catch(e){connFail()}
  finally{flushBusy=false;renderStatus()}
}
function itemsOf(id){
  const base=S.agg.get(id)?.items||{};
  const pend=S.pending.filter(p=>!S.seen.has(p.id)&&p.area+"~"+pkey(p.name)===id);
  if(!pend.length)return base;
  const c=Object.assign({},base);
  for(const p of pend){const it=Object.assign({q:0,t:0},c[p.cis]);it.q=Math.round((it.q+p.d)*1000)/1000;if(p.t>it.t)it.t=p.t;if(p.cis.startsWith("?")){it.n=p.nm;it.c=p.note}c[p.cis]=it}
  return c;
}
function allDocIds(){const ids=new Set(S.agg.keys());S.pending.forEach(p=>ids.add(p.area+"~"+pkey(p.name)));return [...ids]}
const docId=a=>a+"~"+pkey(S.name);
const areaOf=id=>id.split("~")[0];
const isMine=id=>!!S.name&&id.slice(id.indexOf("~")+1)===pkey(S.name);
function docName(id){return isMine(id)?S.name:(S.agg.get(id)?.name||S.pending.find(p=>p.area+"~"+pkey(p.name)===id)?.name||"bez jména")}
function totals(){
  const t=new Map();
  for(const id of allDocIds()){
    const a=areaOf(id), it=itemsOf(id);
    for(const k in it){const q=+it[k].q||0;if(!q&&!t.has(k))continue;let o=t.get(k);if(!o){o={ALL:0,SKLAD:0,OBCHOD:0,MICHARNA:0};t.set(k,o)}o.ALL+=q;o[a]=(o[a]||0)+q;if(it[k].n)o.n=it[k].n}
  }
  return t;
}
function breakdown(key){
  const out=[];for(const id of allDocIds()){const it=itemsOf(id)[key];if(it&&+it.q)out.push({area:areaOf(id),q:+it.q,name:docName(id)||"bez jména",me:isMine(id)})}
  return out;
}
const myQ=key=>+(itemsOf(docId(S.area))[key]?.q)||0;

function addEntry(key,d,extra){
  const e={id:uid(),area:S.area,name:S.name,dev:S.dev,cis:key,d:Math.round(d*1000)/1000,t:Date.now(),nm:extra&&extra.n||itemName(key),note:extra&&extra.c||""};
  S.pending.push(e); savePending(); flush();
}
function canCount(){
  if(!API){toast("Stránka není propojená s tabulkou.");return false}
  if(!S.name){S.view="scan";render();toast("Nejdřív se přihlaste.");return false}
  return true;
}
function addQ(key,d,extra){
  if(!canCount())return false;
  const cur=myQ(key); if(cur+d<0)d=-cur; if(!d)return false;
  addEntry(key,d,extra);
  toast(`${d>=0?"+":""}${fmt(d)} · ${extra&&extra.n||itemName(key)}`);
  return true;
}
function setQ(key,q){
  if(!canCount())return;
  const d=q-myQ(key); if(d)addEntry(key,d);
  toast(`Můj počet nastaven na ${fmt(q)}`);
}

/* ---------- scanning ---------- */
let zxingP=null, zxReader=null, zxReaderHard=null;
function loadZXing(){
  if(window.ZXing)return Promise.resolve();
  if(!zxingP)zxingP=new Promise((res,rej)=>{const s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=res;s.onerror=()=>{zxingP=null;rej(new Error("load"))};document.head.appendChild(s)});
  return zxingP;
}
function zxReaderFor(hard){
  const Z=window.ZXing; let r=hard?zxReaderHard:zxReader; if(r)return r;
  const hints=new Map(); if(hard)hints.set(Z.DecodeHintType.TRY_HARDER,true);
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E,Z.BarcodeFormat.CODE_128,Z.BarcodeFormat.CODE_39,Z.BarcodeFormat.ITF]);
  r=new Z.MultiFormatReader(); r.setHints(hints); if(hard)zxReaderHard=r; else zxReader=r; return r;
}
function zxDecode(cv,hard){
  const ctx=cv.getContext("2d",{willReadFrequently:true}),w=cv.width,h=cv.height,d=ctx.getImageData(0,0,w,h).data;
  const lum=new Uint8ClampedArray(w*h);for(let i=0,j=0;i<w*h;i++,j+=4)lum[i]=(d[j]*299+d[j+1]*587+d[j+2]*114)/1000;
  const Z=window.ZXing;
  try{return zxReaderFor(hard).decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(lum,w,h)))).getText()}
  catch(e){return null}
}
const CAM={stream:null,track:null,det:null,timer:0,busy:false,paused:false,last:"",lastT:0,torch:false,frame:0,cv:null,audio:null};
function beep(){
  try{const a=CAM.audio;if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=1900;g.gain.value=.12;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.08)}catch(e){}
  try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}
}
async function camStart(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){toast("Tento prohlížeč neumí kameru. Otevřete stránku v Safari nebo Chrome.");return}
  try{CAM.audio=CAM.audio||new (window.AudioContext||window.webkitAudioContext)();CAM.audio.resume&&CAM.audio.resume()}catch(e){}
  try{
    CAM.stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}}});
  }catch(e){toast(e&&e.name==="NotAllowedError"?"Přístup ke kameře je zakázaný. Povolte ho v nastavení prohlížeče.":"Kameru se nepodařilo zapnout.");return}
  S.cam=true; CAM.paused=false; CAM.last="";
  const v=$("#video"); v.srcObject=CAM.stream; $("#cambox").hidden=false; render();
  try{await v.play()}catch(e){}
  CAM.track=CAM.stream.getVideoTracks()[0];
  try{const caps=CAM.track.getCapabilities&&CAM.track.getCapabilities();$("#torchBtn").hidden=!(caps&&caps.torch)}catch(e){}
  CAM.det=null;
  if("BarcodeDetector" in window){try{const f=await BarcodeDetector.getSupportedFormats();const want=["ean_13","ean_8","upc_a","upc_e","code_128","code_39","itf"].filter(x=>f.includes(x));if(want.length)CAM.det=new BarcodeDetector({formats:want})}catch(e){}}
  if(!CAM.det){try{await loadZXing()}catch(e){toast("Nepodařilo se načíst čtečku kódů. Zkontrolujte internet.");camStop();return}}
  setCamText("Namiřte na čárový kód");
  clearTimeout(CAM.timer); tick();
}
function camStop(){
  clearTimeout(CAM.timer); S.cam=false;
  if(CAM.stream)CAM.stream.getTracks().forEach(t=>t.stop());
  CAM.stream=null; CAM.track=null; CAM.torch=false;
  $("#video").srcObject=null; $("#cambox").hidden=true; render();
}
function setCamText(t){$("#camres").textContent=t}
function camPause(p){CAM.paused=p;$("#camPaused").hidden=!p}
function grabFrame(v,rot){
  const vw=v.videoWidth,vh=v.videoHeight; if(!vw)return null;
  const cv=CAM.cv||(CAM.cv=document.createElement("canvas")); const ctx=cv.getContext("2d",{willReadFrequently:true});
  if(!rot){
    const cw=vw*.9,ch=vh*.5,s=Math.min(1,900/cw);
    cv.width=Math.round(cw*s);cv.height=Math.round(ch*s);
    ctx.drawImage(v,(vw-cw)/2,(vh-ch)/2,cw,ch,0,0,cv.width,cv.height);
  }else{
    const s=Math.min(1,800/Math.max(vw,vh)),w=Math.round(vw*s),h=Math.round(vh*s);
    cv.width=h;cv.height=w;ctx.setTransform(1,0,0,1,0,0);ctx.translate(h,0);ctx.rotate(Math.PI/2);ctx.drawImage(v,0,0,w,h);ctx.setTransform(1,0,0,1,0,0);
  }
  return cv;
}
async function tick(){
  if(!S.cam)return;
  const v=$("#video");
  if(!CAM.paused&&!CAM.busy&&v.readyState>=2){
    CAM.busy=true; let code=null;
    try{
      if(CAM.det){const r=await CAM.det.detect(v);if(r&&r.length)code=r[0].rawValue}
      else{CAM.frame++;const cv=grabFrame(v,CAM.frame%4===3);if(cv)code=zxDecode(cv,false)}
    }catch(e){}
    CAM.busy=false;
    if(code&&S.cam)onCamCode(code);
  }
  CAM.timer=setTimeout(tick,CAM.det?90:120);
}
function onCamCode(code){
  const now=Date.now();
  if(code===CAM.last&&now-CAM.lastT<1500){CAM.lastT=now;return}
  CAM.last=code;CAM.lastT=now;
  beep(); const box=$("#cambox"); box.classList.remove("hit"); void box.offsetWidth; box.classList.add("hit");
  const hits=lookupCode(code);
  if(S.fast&&S.module==="inventura"&&hits.length===1){
    const key=S.catalog[hits[0]][2];
    if(addQ(key,1)){S.current=key;S.choices=S.results=S.notFound=null;setCamText(`+1 · ${itemName(key)} (můj počet ${fmt(myQ(key))})`);render()}
    return;
  }
  camPause(true);
  setCamText(hits.length===1?itemName(S.catalog[hits[0]][2]):hits.length?"Kód má víc položek, vyberte níže":"Kód "+code+" není v seznamu");
  handleCode(code,{fromScan:true,fromCam:true});
}
async function decodeFile(file){
  const img=await createImageBitmap(file).catch(async()=>{const u=URL.createObjectURL(file);const im=new Image();im.src=u;await im.decode();return im});
  if("BarcodeDetector" in window){try{const r=await new BarcodeDetector().detect(img);if(r&&r[0])return r[0].rawValue}catch(e){}}
  await loadZXing();
  for(const [max,rot] of [[1400,false],[1400,true],[900,false],[900,true],[2000,false]]){
    const s=Math.min(1,max/Math.max(img.width,img.height)),w=Math.round(img.width*s),h=Math.round(img.height*s);
    const cv=document.createElement("canvas");cv.width=rot?h:w;cv.height=rot?w:h;const ctx=cv.getContext("2d");
    if(rot){ctx.translate(h,0);ctx.rotate(Math.PI/2)}ctx.drawImage(img,0,0,w,h);
    const r=zxDecode(cv,true);if(r)return r;
    await new Promise(r=>setTimeout(r,0));
  }
  return null;
}

/* ---------- actions ---------- */
const CZ_DIGITS={"+":"1","ě":"2","š":"3","č":"4","ř":"5","ž":"6","ý":"7","á":"8","í":"9","é":"0"};
function fixScanner(v){
  // čtečka na české klávesnici píše místo číslic +ěščřžýáíé
  const t=String(v||"").trim();
  if(t.length>=6&&/^[+ěščřžýáíé0-9=.]+$/.test(t)&&/[+ěščřžýáíé]/.test(t))return t.replace(/[+ěščřžýáíé]/g,c=>CZ_DIGITS[c]).replace(/=/g,"-");
  return t;
}
function handleCode(raw,{fromScan,fromCam}={}){
  const code=fixScanner(raw); S.query=code; S.resetCode=true; S.choices=null;S.results=null;S.notFound=null;
  if(!code){S.current=null;render();return}
  const hits=lookupCode(code);
  if(hits.length===1){
    S.current=S.catalog[hits[0]][2]; S.query="";
    if(S.fast&&S.module==="inventura"&&fromScan&&!fromCam){addQ(S.current,1);render();focusCode();return}
    render(); if(!S.cam)focusQty(); scrollToCard(); return;
  }
  if(hits.length>1){S.choices=hits;S.current=null;render();return}
  if(/^\d{6,14}$/.test(code)){S.notFound=code;S.current=null;render();return}
  S.results=searchText(code);S.current=null;
  if(!S.results.length)S.notFound=code;
  render();
}
function pick(cis){S.current=cis;S.choices=null;S.results=null;S.notFound=null;S.query="";render();if(!S.cam)focusQty();scrollToCard()}
function afterSave(){S.renderedCard=null;if(S.cam){camPause(false);setCamText("Namiřte na další kód");S.current=null;render();window.scrollTo({top:0,behavior:"smooth"})}else{render();focusCode()}}
function focusQty(){requestAnimationFrame(()=>{const q=$("#qty");if(q){q.focus();q.select()}})}
function focusCode(){requestAnimationFrame(()=>{const c=$("#code");if(c&&!("ontouchstart" in window))c.focus()})}
function scrollToCard(){requestAnimationFrame(()=>{const c=$("#card");if(c&&S.cam)c.scrollIntoView({block:"nearest",behavior:"smooth"})})}

/* ---------- rendering ---------- */
function render(){
  document.body.dataset.area=S.area;
  $("#whoName").textContent=S.name||"nepřihlášen";
  const inv=S.module==="inventura", ord=S.module==="objednavky", dod=S.module==="dodaci", lab=S.module==="stitky", inApp=!!(API&&S.name&&!S.newPin);
  document.body.classList.toggle("wide",lab&&inApp);
  if(ord||dod)document.body.dataset.area="OBCHOD";
  $("#appTitle").lastChild.textContent=inv?"Inventura":ord?"Objednávky":dod?"Dodací listy":lab?"Štítky":"BLR App";
  $("#appLogo").hidden=inv||ord||dod||lab;
  $("#homeBtn").hidden=!((inv||ord||dod||lab)&&inApp);

function ordDup(key){return key&&key!=="__free__"&&S.osup?S.ord.rows.find(x=>x[4]===key&&x[3]===S.osup&&x[10]==="Zapsáno"):null}
async function submitOrder(){
  const key=S.current, free=key==="__free__", r=free?null:itemRow(key);
  const nm=free?($("#ofree").value.trim()):(r?r[0]:key);
  if(!nm){toast("Napište název zboží");return}
  if(!S.osup){toast("Vyberte dodavatele");return}
  const q=parseQ($("#qty").value); if(isNaN(q)||q<=0){toast("Zadejte počet");return}
  if(S.osaving)return;
  const btn=$("#ordForm button[type=submit]");S.osaving=true;if(btn){btn.disabled=true;btn.textContent="Zapisuji…"}
  const dup=ordDup(key);
  if(dup){const note=$("#onote").value.trim();S.current=null;S.osupFor=null;S.query="";S.resetCode=true;
    await ordSet([dup[0]],{qty:q,unit:S.ounit,note},`Počet změněn: ${nm} · ${fmt(q)} ${S.ounit==="bal"?"bal.":"ks"}`);
    S.osaving=false;afterSave();return}
  const e={id:uid(),dod:S.osup,cis:free?"":key,nm,ean:free?(S.freeEan||""):(r&&r[1]||""),qty:q,unit:S.ounit,note:$("#onote").value.trim()};
  try{await ordPost({a:"ord_add",entries:[e]});
    S.ord.rows.push([e.id,Date.now(),S.name,e.dod,e.cis,e.nm,e.ean,q,e.unit,e.note,"Zapsáno",Date.now(),S.name]);
    if(e.cis)S.ord.map[e.cis]=e.dod;
    toast(`Zapsáno: ${nm} · ${e.dod}`); S.freeEan=""; S.osupFor=null; S.current=null; S.query=""; S.resetCode=true; afterSave(); loadOrders();
  }catch(err){if(err.message!=="pin")toast("Nepodařilo se zapsat. Zkontrolujte připojení a zkuste znovu.");if(btn){btn.disabled=false;btn.textContent="Zapsat do objednávky"}}
  finally{S.osaving=false}
}
function viewOrdList(){
  const F={zap:["Zapsáno"],obj:["Objednáno"],vse:["Zapsáno","Objednáno"]};
  if(!F[S.ofilt])S.ofilt="zap";
  const want=F[S.ofilt];
  const rows=S.ord.rows.filter(r=>want.includes(r[10])&&ordVis(r));
  const names=S.ord.sup.map(x=>x[0]); rows.forEach(r=>{if(!names.includes(r[3]))names.push(r[3])});
  const chips=[["zap","K objednání",ordCount("Zapsáno")],["obj","Objednáno",ordCount("Objednáno")],["vse","Vše",null]];
  let h=`<section class="panel"><div class="chips">${chips.map(([k,l,c])=>`<button type="button" class="chip" data-ofilt="${k}" aria-pressed="${S.ofilt===k}">${l}${c!=null?` (${c})`:""}</button>`).join("")}</div>
    ${S.ofilt==="obj"?`<p class="hint" style="margin:0">Objednané položky se ukazují ${OBJ_DNI} dní, pak zůstanou jen v tabulce.</p>`:""}</section>`;
  if(!S.ord.loaded)return h+`<section class="panel"><p class="hint" style="margin:0">Načítám objednávky…</p></section>`;
  let any=false;
  for(const n of names){
    const g=rows.filter(r=>r[3]===n).sort((a,b)=>a[1]-b[1]); if(!g.length)continue; any=true;
    const si=supInfo(n), how=si[1];
    h+=`<section class="panel"><div class="ohead"><h3>${esc(n)}</h3><span class="stag">${esc(how)}</span></div>
      ${si[3]?`<div class="hint">${esc(si[3])}</div>`:""}
      <div class="oacts">
        ${S.ofilt==="zap"?(how==="Cézar"?`<button class="btn" type="button" data-supact="csv" data-sup="${esc(n)}">Stáhnout CSV pro Cézar</button>`:`<button class="btn" type="button" data-supact="copy" data-sup="${esc(n)}">Kopírovat seznam</button>`)
          +(si[2]?`<a class="btn" href="${esc(si[2])}" target="_blank" rel="noopener">Otevřít B2B ↗</a>`:"")
          +`<button class="btn" type="button" data-supact="allobj" data-sup="${esc(n)}">${S.oconf==="allobj|"+n?"Opravdu? Klepněte znovu":"Vše objednáno"}</button>`:""}
        ${S.ofilt!=="vse"?`<button class="btn danger" type="button" data-supact="alldel" data-sup="${esc(n)}">${S.oconf==="alldel|"+n?`Opravdu smazat ${g.length} pol.?`:"Smazat celou objednávku"}</button>`:""}
      </div>
      <div class="list">${g.map(r=>ordRow(r)).join("")}</div></section>`;
  }
  if(!any)h+=`<section class="panel"><p class="hint" style="margin:0">${S.ofilt==="zap"?"Nic nečeká na objednání. Nové položky zapíšete v záložce Zapsat.":"Žádné položky."}</p></section>`;
  return h;
}

}
async function ordSet(ids,patch,msg){
  try{await ordPost(Object.assign({a:"ord_set",ids},patch));
    S.ord.rows.forEach(r=>{if(ids.includes(r[0])){if(patch.stav)r[10]=patch.stav;if(patch.qty)r[7]=patch.qty;r[11]=Date.now();r[12]=S.name}});
    S.ord.rows=S.ord.rows.filter(r=>r[10]!=="Zrušeno");
    S.osel=null;S.oconf=null;toast(msg||"Uloženo");render();loadOrders();
  }catch(err){if(err.message!=="pin")toast("Nepodařilo se uložit. Zkontrolujte připojení.")}
}
function ordAction(st,id,b){
  if(st==="Zrušeno"&&S.oconf!=="del|"+id){S.oconf="del|"+id;render();return}
  ordSet([id],{stav:st},st==="Zrušeno"?"Zrušeno":"Označeno: "+st.toLowerCase());
}
async function supAction(act,sup,b){
  const g=S.ord.rows.filter(r=>r[3]===sup&&ordVis(r)&&r[10]===(act==="alldel"&&S.ofilt==="obj"?"Objednáno":"Zapsáno"));
  if(act==="alldel"){
    if(S.oconf!=="alldel|"+sup){S.oconf="alldel|"+sup;render();return}
    ordSet(g.map(r=>r[0]),{stav:"Zrušeno"},`${sup}: smazáno ${g.length} pol.`);return;
  }
  if(!g.length)return;
  if(act==="allobj"||act==="alldod"){
    if(S.oconf!==act+"|"+sup){S.oconf=act+"|"+sup;render();return}
    ordSet(g.map(r=>r[0]),{stav:act==="allobj"?"Objednáno":"Dodáno"},`${sup}: ${g.length} pol. ${act==="allobj"?"objednáno":"dodáno"}`);return;
  }
  if(act==="csv"){
    const ok=g.filter(r=>r[4]), bal=ok.filter(r=>r[8]==="bal"), skip=g.length-ok.length;
    const lines=ok.map(r=>r[4]+";"+String(Math.round(r[7]*1000)/1000));
    const d=new Date(),p2=n=>String(n).padStart(2,"0"),name=`Objednavka-${sup.normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^A-Za-z0-9]+/g,"_")}-${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.csv`;
    const blob=new Blob([lines.join("\r\n")+"\r\n"],{type:"text/csv"});
    if(window.showSaveFilePicker&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){
      try{const fh=await showSaveFilePicker({id:"blr-obj-csv",suggestedName:name,types:[{description:"CSV",accept:{"text/csv":[".csv"]}}]});const w=await fh.createWritable();await w.write(blob);await w.close()}
      catch(err){if(err&&err.name==="AbortError")return;toast("Uložení se nepovedlo");return}
    }else saveBlob(blob,name);
    toast(`${lines.length} řádků uloženo`+(bal.length?` · ${bal.length} v baleních – zkontrolujte počet`:"")+(skip?` · ${skip} bez kódu zadejte ručně`:""));return;
  }
  if(act==="copy"){
    const txt=`Objednávka ${sup} – ${new Date().toLocaleDateString("cs-CZ")}\n`+g.map(r=>`${r[5]} – ${fmt(r[7])} ${r[8]==="bal"?"bal.":"ks"}${r[9]?" ("+r[9]+")":""}${r[6]?" · EAN "+r[6]:""}${r[4]?" · "+r[4]:""}`).join("\n");
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Seznam zkopírován, vložte ho kam potřebujete")).catch(()=>{toast("Kopírování nejde, seznam je níže");const p=document.createElement("textarea");p.value=txt;p.style.cssText="width:100%;height:160px;margin-top:8px";b.closest("section").appendChild(p);p.select()});
  }
}

/* razítko s podpisem: z tabulky (Google Disk, soubor razitko-blr.png) jen pro přihlášené, pamatuje si ho telefon */
function loadRazitko(){if(S.razLoad||S.raz)return;const c=store.get("raz",null);if(c){S.raz=c;return}
  S.razLoad=true;ordPost({a:"firma"}).then(r=>{S.raz=r.razitko||"";if(S.raz)store.set("raz",S.raz)}).catch(()=>{S.raz=""}).finally(()=>{S.razLoad=false;if(S.dprint)render()})}
const DLR={id:0,c:1,t:2,kdo:3,oc:4,on:5,ico:6,cis:7,nm:8,ean:9,q:10,note:11,prev:12,dn:13,st:14,zm:15,zk:16};
function dlDraft(){if(!S.dd)S.dd=store.get("dldraft",null)||{id:uid(),odb:null,items:[]};return S.dd}
function dlSaveDraft(){store.set("dldraft",S.dd)}
const todayIso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const sigReq=c=>{const o=odbOf(c);return !!(o&&o[7])};
function odbOf(c){return S.odb.rows.find(r=>r[0]===c)||null}
function dlGroups(rows){const m=new Map();rows.forEach(r=>{if(!m.has(r[1]))m.set(r[1],[]);m.get(r[1]).push(r)});return [...m.values()]}
function dlOpenCount(){return new Set(S.dl.rows.filter(r=>r[14]==="Vystaveno"&&typeof r[17]!=="number").map(r=>r[1])).size}
let dlBusy=false,odbBusy=false;
async function loadDl(){
  if(!API||!S.name||dlBusy)return; dlBusy=true;
  try{const r=await apiGet({a:"dl"});
    if(r.ok){S.dl={rows:r.rows||[],use:r.use||{},admins:r.admins||[],cz:r.cz||null,loaded:true};connOk();
      if(S.module==="dodaci"||S.module==="home"){const a=document.activeElement;if(!(a&&a.tagName==="INPUT"&&a.closest("#main"))&&!S.sigDrawing)render()}}
    else connFail(r);
  }catch(e){connFail()}finally{dlBusy=false}
}
async function loadOdb(force){
  if(!API||!S.name||odbBusy)return;
  if(!force&&S.odb.loaded&&Date.now()-S.odb.t<36e5)return;
  odbBusy=true;
  try{const r=await apiGet({a:"odb"});if(r.ok){S.odb={rows:r.rows||[],at:r.at||"",loaded:true,t:Date.now()};store.set("odb",S.odb);if(S.module==="dodaci"&&!S.dd?.odb)render()}}
  catch(e){}finally{odbBusy=false}
}
function odbLi(r){const n=S.dl.use[r[0]]||0;
  return `<button type="button" class="li" data-dodb="${esc(r[0])}"><span class="n">${esc(r[1])}</span><span class="q" style="font-size:14px">${n?n+"×":""}</span><span class="s">${r[2]?"IČO "+esc(r[2])+" · ":""}${esc(r[3]||"")}${r[4]?", "+esc(r[4]):""} · č. ${esc(r[0])}${r[7]?` · <b>podpis povinný</b>`:""}</span></button>`}
function viewDlNew(){
  const d=dlDraft();
  if(S.dlDone){const x=S.dlDone;return `<section class="panel"><h2>Dodací list uložen</h2>
    <p class="hello" style="margin:0">${esc(x.cislo)}</p><p style="margin:0"><b>${esc(x.odbN)}</b> · ${x.n} pol.${x.prevzal?" · převzal "+esc(x.prevzal):""}</p>
    <p class="hint" style="margin:0">Do Cézaru se jako výdejka předá sám do hodiny.</p>
    <button class="btn primary big" type="button" data-dprint="${esc(x.cislo)}">Tisk / PDF dodáku</button><button class="btn" type="button" id="dlNext">Nový dodací list</button></section>`}
  if(!d.odb){
    const q=norm(S.dq||""); let list, title;
    if(q){const qq=q.split(/\s+/);list=S.odb.rows.filter(r=>{const h=norm(r[1]+" "+r[2]+" "+r[3]+" "+r[0]);return qq.every(w=>h.includes(w))}).sort((a,b)=>(S.dl.use[b[0]]||0)-(S.dl.use[a[0]]||0)).slice(0,200);title=`Nalezeno ${list.length>=200?"200+ (upřesněte hledání)":list.length}`}
    else{list=S.odb.rows.filter(r=>S.dl.use[r[0]]).sort((a,b)=>S.dl.use[b[0]]-S.dl.use[a[0]]).slice(0,25);title="Nejčastější odběratelé"}
    return `<section class="panel"><h2>1. Pro koho je dodací list?</h2>

const SIG={pts:[],cur:null};
function sigInit(){
  const c=$("#sig"); if(!c||c.dataset.on)return; c.dataset.on="1";
  const fit=()=>{const r=c.getBoundingClientRect();c.width=r.width*devicePixelRatio;c.height=r.height*devicePixelRatio;sigDraw()};fit();
  const P=e=>{const r=c.getBoundingClientRect();return [Math.round((e.clientX-r.left)/r.width*1000),Math.round((e.clientY-r.top)/r.height*340)]};
  c.addEventListener("pointerdown",e=>{c.setPointerCapture(e.pointerId);S.sigDrawing=true;SIG.cur=[P(e)];SIG.pts.push(SIG.cur);sigDraw()});
  c.addEventListener("pointermove",e=>{if(!SIG.cur)return;const p=P(e),l=SIG.cur[SIG.cur.length-1];if(Math.abs(p[0]-l[0])+Math.abs(p[1]-l[1])>=4){SIG.cur.push(p);sigDraw()}});
  const end=()=>{SIG.cur=null;S.sigDrawing=false};c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
}
function sigDraw(){const c=$("#sig");if(!c)return;const x=c.getContext("2d");x.clearRect(0,0,c.width,c.height);x.strokeStyle="#111";x.lineWidth=2.4*devicePixelRatio;x.lineCap=x.lineJoin="round";
  const sx=c.width/1000,sy=c.height/340;SIG.pts.forEach(s=>{x.beginPath();s.forEach((p,i)=>i?x.lineTo(p[0]*sx,p[1]*sy):x.moveTo(p[0]*sx,p[1]*sy));if(s.length===1)x.lineTo(s[0][0]*sx+1,s[0][1]*sy);x.stroke()})}
function sigPath(){return SIG.pts.filter(s=>s.length).map(s=>"M"+s.map(p=>p[0]+" "+p[1]).join("L")+(s.length===1?"l1 0":"")).join("")}

const MOBIL=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const sigImg=p=>"data:image/svg+xml;charset=utf-8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340"><path d="${p.replace(/[^MLl0-9 .-]/g,"")}" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg>`);
const libP={};function loadLib(u){return libP[u]||(libP[u]=new Promise((res,rej)=>{const s=document.createElement("script");s.src=u;s.onload=res;s.onerror=()=>{delete libP[u];rej(new Error("load"))};document.head.appendChild(s)}))}
/* soubor na mobilu: iPhone v aplikaci z plochy neumí stahovat ani tisknout → nabídka Sdílet (Tisk, Uložit do Souborů, AirDrop, e-mail…) */
function mobilShare(file,title){
  if(!(MOBIL&&navigator.canShare&&navigator.share))return false;
  try{if(!navigator.canShare({files:[file]}))return false}catch(e){return false}
  navigator.share({files:[file],title:title||file.name}).catch(err=>{
    if(err&&err.name==="AbortError")return;
    if(err&&err.name==="NotAllowedError"){toast("Soubor je připravený, klepněte na tlačítko ještě jednou");return}
    toast("Sdílení se nepovedlo");
  });
  return true;
}
function saveBlob(blob,name,title){
  const f=new File([blob],name,{type:blob.type||"application/octet-stream"});
  if(mobilShare(f,title))return;
  const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);
}
let pdfBusy=null;
function dlPdfPrepare(c){
  if(S.pdfFor===c&&(S.pdfFile||pdfBusy))return;
  if((S.sigSvg===null&&!S.sigErr)||S.razLoad||S.sigFor!==c)return;
  const doc=document.querySelector(".printdoc");if(!doc)return;
  S.pdfFor=c;S.pdfFile=null;
  pdfBusy=(async()=>{
    try{
      await Promise.all([loadLib("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"),loadLib("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js")]);
      await new Promise(r=>setTimeout(r,300));
      const src=document.querySelector(".printdoc");if(!src||S.dprint!==c)return;
      const cl=src.cloneNode(true);cl.classList.add("a4");cl.style.cssText="position:fixed;left:-10000px;top:0;width:794px;padding:38px 45px;border-radius:0;box-shadow:none";
      document.body.appendChild(cl);
      await Promise.all([...cl.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
      const cv=await html2canvas(cl,{scale:2,backgroundColor:"#ffffff",logging:false});cl.remove();
      const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",compress:true});
      const pw=210,ph=297,pxPerPage=Math.floor(cv.width*ph/pw);
      for(let y=0,i=0;y<cv.height;y+=pxPerPage,i++){
        const h=Math.min(pxPerPage,cv.height-y),part=document.createElement("canvas");part.width=cv.width;part.height=h;
        const x=part.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,part.width,h);x.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
        if(i)pdf.addPage();pdf.addImage(part.toDataURL("image/jpeg",0.92),"JPEG",0,0,pw,h*pw/cv.width);
      }
      if(S.pdfFor!==c)return;
      S.pdfFile=new File([pdf.output("blob")],`Dodaci-list-${c}.pdf`,{type:"application/pdf"});
    }catch(e){S.pdfFor=null;S.pdfErr=true;toast("PDF se nepodařilo připravit – zkontrolujte internet")}
    finally{pdfBusy=null;const b=$("#dprintGo");if(b&&S.dprint===c)b.textContent=S.pdfFile?"Tisk / sdílet PDF":"Zkusit znovu"}
  })();
}
async function dlPdfShare(c){
  const f=S.pdfFor===c&&S.pdfFile;
  if(!f){if(!pdfBusy){S.pdfFor=null;dlPdfPrepare(c)}toast("Připravuji PDF, za chvilku klepněte znovu");return}
  try{
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Dodací list "+c});
    else{const a=document.createElement("a");a.href=URL.createObjectURL(f);a.download=f.name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000)}
  }catch(e){if(!(e&&e.name==="AbortError")){const u=URL.createObjectURL(f);window.open(u,"_blank")}}
}

function overviewRows(){

    let ok;
    if(S.ovFilter==="diff")ok=(all>0||stav>0)&&all!==stav&&(a==="ALL"||cnt>0);
    else if(S.ovFilter==="counted")ok=cnt>0;
    else ok=all<=0&&stav>0;
    if(ok&&q&&!r._n.includes(q))ok=false;
    if(ok)rows.push({r,cnt,all,stav});
  });
  for(const [k,o] of t){if(k.startsWith("?")&&S.ovFilter!=="missing"&&o.ALL>0&&(a==="ALL"||o[a]>0)&&(!q||norm((o.n||"")+" "+k).includes(q)))rows.push({r:[o.n||"Neznámé zboží",k.slice(1),k,0],cnt:a==="ALL"?o.ALL:o[a],all:o.ALL,stav:0,unk:true})}

  const sum=[["Název zboží","Číslo zboží","Součet inventur"]];
  S.catalog.forEach(r=>{const o=t.get(r[2]);sum.push([r[0],r[2],o?o.ALL:0])});

  for(const a of AREAS){

    S.catalog.forEach(r=>{const o=t.get(r[2]);if(o&&o[a.id]>0)rows.push([r[0],r[1]||r[2],r[2],o[a.id],+r[3]||0])});

  }
  const diff=[["Název zboží","Číslo zboží","Čárový kód","Stav na skladě","Spočítáno","Rozdíl"]];
  S.catalog.map(r=>{const o=t.get(r[2]);const c=o?o.ALL:0;const s=+r[3]||0;return [r[0],r[2],r[1]||"",s,c,c-s]}).filter(x=>x[5]!==0&&(x[3]>0||x[4]>0)).sort((a,b)=>Math.abs(b[5])-Math.abs(a[5])).forEach(x=>diff.push(x));

  const unk=[...t].filter(([k,o])=>k.startsWith("?")&&o.ALL>0);
  if(unk.length){const u=[["Popis","Načtený kód","Sklad","Obchod","Míchárna","Celkem"]];unk.forEach(([k,o])=>u.push([o.n||"",k.slice(1),o.SKLAD,o.OBCHOD,o.MICHARNA,o.ALL]));XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(u),"Mimo katalog")}
  if(S.inv&&S.inv.start){const info=[["Inventura zahájena",S.inv.start],["Stavy z Cézaru k",S.inv.stav||""],["Ukončena",S.inv.end||""],["Export z aplikace",new Date().toLocaleString("cs-CZ")]];

const LAB_TYPES=[{id:"regal",name:"Regálový štítek",desc:"A4 dělená na 4 díly · 48 štítků 52,5 × 24,75 mm · název + čárový kód"}];
const LAB=(()=>{
  const C128=["212222", "222122", "222221", "121223", "121322", "131222", "122213", "122312", "132212", "221213", "221312", "231212", "112232", "122132", "122231", "113222", "123122", "123221", "223211", "221132", "221231", "213212", "223112", "312131", "311222", "321122", "321221", "312212", "322112", "322211", "212123", "212321", "232121", "111323", "131123", "131321", "112313", "132113", "132311", "211313", "231113", "231311", "112133", "112331", "132131", "113123", "113321", "133121", "313121", "211331", "231131", "213113", "213311", "213131", "311123", "311321", "331121", "312113", "312311", "332111", "314111", "221411", "431111", "111224", "111422", "121124", "121421", "141122", "141221", "112214", "112412", "122114", "122411", "142112", "142211", "241211", "221114", "413111", "241112", "134111", "111242", "121142", "121241", "114212", "124112", "124211", "411212", "421112", "421211", "212141", "214121", "412121", "111143", "111341", "131141", "114113", "114311", "411113", "411311", "113141", "114131", "311141", "411131", "211412", "211214", "211232", "2331112"];
  const G={pageW:210,pageH:297,cols:4,rows:12,cellW:52.5,cellH:24.75,side:2,barH:10,barBottom:3,module:0.27,minModule:0.19,bwr:0.05}; /* varianta J ze zkušebního archu 20. 11. 2026 – nejlépe čitelná po tisku */
  /* bwr = zúžení každé čáry kódu (mm) – vyrovnává rozpíjení toneru/inkoustu při tisku */
  const NAME_FONT='"Barlow Condensed","Arial Narrow",sans-serif', NUM_FONT='"Barlow",Arial,sans-serif';
  const cv=document.createElement("canvas").getContext("2d");
  function measure(t,bold,size){cv.font=(bold?'700 100px '+NAME_FONT:'500 100px '+NUM_FONT);return cv.measureText(t).width/100*size*0.35278}
  function modules(text){
    const codes=[];
    if(/^\d+$/.test(text)&&text.length%2===0&&text.length>=4){codes.push(105);for(let i=0;i<text.length;i+=2)codes.push(+text.substr(i,2))}
    else{codes.push(104);for(const ch of text)codes.push(ch.charCodeAt(0)-32)}
    let sum=codes[0];for(let k=1;k<codes.length;k++)sum+=codes[k]*k;codes.push(sum%103);codes.push(106);
    const w=[];codes.forEach(c=>C128[c].split("").forEach(x=>w.push(+x)));return w;
  }
  const encodable=t=>!!t&&/^[\x20-\x7E]+$/.test(t);
  function fit(text,bold,size,maxW,min){
    while(measure(text,bold,size)>maxW&&size>min)size-=0.25;
    if(measure(text,bold,size)>maxW){while(text.length&&measure(text+"…",bold,size)>maxW)text=text.slice(0,-1);text+="…"}
    return {text,size};
  }
  // pořadí plnění: pole po poli (LH, PH, LD, PD), uvnitř pole po řádcích
  const ORDER=[];for(let q=0;q<4;q++){const qc=q%2,qr=Math.floor(q/2);for(let r=0;r<6;r++)for(let c=0;c<2;c++)ORDER.push({q,k:(qr*6+r)*4+qc*2+c})}
  function pages(items,usedQ){
    if((usedQ||[]).length>=4)usedQ=[];
    const queue=[];items.forEach(it=>{for(let i=0;i<it.q;i++)queue.push(it)});
    const out=[];let qi=0;
    while(qi<queue.length){const s=new Array(48).fill(null),first=!out.length;
      for(const o of ORDER){if(qi>=queue.length)break;if(first&&usedQ.includes(o.q))continue;s[o.k]=queue[qi++]}
      out.push(s)}
    return out;
  }
  function layout(slots,showNum){
    const ops=[],maxW=G.cellW-2*G.side;
    const noV=v=>Math.abs(v)<.01||Math.abs(v-105)<.01||Math.abs(v-210)<.01, noH=v=>Math.abs(v)<.01||Math.abs(v-148.5)<.01||Math.abs(v-297)<.01;
    slots.forEach((it,k)=>{
      if(!it)return;
      const col=k%4,row=Math.floor(k/4),x=col*G.cellW,y=row*G.cellH,cx=x+G.cellW/2;
      if(!noV(x))ops.push({t:"l",x1:x,y1:y,x2:x,y2:y+G.cellH});
      if(!noV(x+G.cellW))ops.push({t:"l",x1:x+G.cellW,y1:y,x2:x+G.cellW,y2:y+G.cellH});
      if(!noH(y))ops.push({t:"l",x1:x,y1:y,x2:x+G.cellW,y2:y});
      if(!noH(y+G.cellH))ops.push({t:"l",x1:x,y1:y+G.cellH,x2:x+G.cellW,y2:y+G.cellH});
      const barTop=G.cellH-G.barBottom-G.barH, numBase=barTop-0.8, top=y+3.0;
      const bottom=y+(showNum?numBase-2.3:barTop-0.9), area=bottom-top, name=String(it.n||"").trim();
      if(name){
        let best=null;
        for(let sz=14;sz>=7&&!best;sz-=0.5){
          const L=sz*0.3528;
          if(measure(name,true,sz)<=maxW&&L<=area+.01){best={lines:[name],size:sz};break}
          if(2*L*1.05>area+.01)continue;
          const w=name.split(/\s+/);let pick=null,pw=1e9;
          for(let i=1;i<w.length;i++){const a=w.slice(0,i).join(" "),b=w.slice(i).join(" "),wa=measure(a,true,sz),wb=measure(b,true,sz),m=Math.max(wa,wb);if(wa<=maxW&&wb<=maxW&&m<pw){pw=m;pick=[a,b]}}
          if(pick)best={lines:pick,size:sz};
        }
        if(!best){const sz=7,w=name.split(/\s+/);let a="";while(w.length&&measure((a?a+" ":"")+w[0],true,sz)<=maxW)a=(a?a+" ":"")+w.shift();
          if(!a)a=fit(w.shift()||"",true,sz,maxW,sz).text;best={lines:w.length?[a,fit(w.join(" "),true,sz,maxW,sz).text]:[a],size:sz}}
        const L=best.size*0.3528,step=L*1.05,bh=L+(best.lines.length-1)*step,b0=top+(area-bh)/2+L*0.78;
        best.lines.forEach((ln,i)=>ops.push({t:"t",x:cx,y:b0+i*step,s:ln,size:best.size,bold:true}));
      }
      if(showNum){const c=fit(it.cis,false,6.5,maxW,5);ops.push({t:"t",x:cx,y:y+numBase,s:c.text,size:c.size,bold:false})}
      if(encodable(it.cis)){
        const w=modules(it.cis),tot=w.reduce((a,b)=>a+b,0),mod=Math.max(G.minModule,Math.min(G.module,(maxW-1)/tot));
        let bx=cx-tot*mod/2;const by=y+barTop;
        for(let i=0;i<w.length;i++){if(i%2===0)ops.push({t:"r",x:bx+G.bwr/2,y:by,w:Math.max(0.05,w[i]*mod-G.bwr),h:G.barH});bx+=w[i]*mod}
      }
    });
    return ops;
  }
  function svg(slots,{preview,showNum,usedQ,first}){
    let s=preview?'<svg viewBox="0 0 210 297" xmlns="http://www.w3.org/2000/svg">':'<svg viewBox="0 0 210 297" width="210mm" height="297mm" xmlns="http://www.w3.org/2000/svg">';
    if(preview){
      s+='<rect width="210" height="297" fill="#fff"/>';
      for(let c=1;c<4;c++)s+=`<line x1="${c*G.cellW}" y1="0" x2="${c*G.cellW}" y2="297" stroke="#ecebe6" stroke-width=".2"/>`;
      for(let r=1;r<12;r++)s+=`<line x1="0" y1="${r*G.cellH}" x2="210" y2="${r*G.cellH}" stroke="#ecebe6" stroke-width=".2"/>`;
    }
    const ops=layout(slots,showNum);
    ops.forEach(o=>{if(o.t==="l")s+=`<line x1="${o.x1}" y1="${o.y1}" x2="${o.x2}" y2="${o.y2}" stroke="#8c8c8c" stroke-width=".2"/>`});
    if(preview){s+='<line x1="105" y1="0" x2="105" y2="297" stroke="#d9603f" stroke-width=".5" stroke-dasharray="2 1.5"/><line x1="0" y1="148.5" x2="210" y2="148.5" stroke="#d9603f" stroke-width=".5" stroke-dasharray="2 1.5"/>'}
    ops.forEach(o=>{
      if(o.t==="r")s+=`<rect x="${o.x.toFixed(3)}" y="${o.y.toFixed(3)}" width="${o.w.toFixed(3)}" height="${o.h}" fill="#000"/>`;
      else if(o.t==="t")s+=`<text x="${o.x}" y="${o.y.toFixed(3)}" font-family='${o.bold?NAME_FONT:NUM_FONT}' font-weight="${o.bold?700:500}" font-size="${(o.size*0.35278).toFixed(3)}" text-anchor="middle" fill="#000">${esc(o.s)}</text>`;
    });
    if(preview&&first&&usedQ.length<4)usedQ.forEach(q=>{const x=(q%2)*105,y=Math.floor(q/2)*148.5;
      s+=`<rect x="${x+2}" y="${y+2}" width="101" height="144.5" fill="#f1efe9" rx="2"/><text x="${x+52.5}" y="${y+75}" font-size="5" text-anchor="middle" fill="#9a958b" font-family='${NUM_FONT}'>pole už chybí</text>`});
    return s+"</svg>";
  }
  return {pages,svg,encodable,layout,G};
})();

    if(ci>=0){const ni=h.indexOf("nazev zbozi");let pi=-1;["pocet","pocet ks","ks","pocet stitku","stitku"].forEach(k=>{if(pi<0)pi=h.indexOf(k)});

  </div>

    <span class="row"><button type="button" class="btn" data-lab="prev" aria-label="Předchozí arch">‹</button><span id="labPi">${labPages().length?S.lab.page+1:1} / ${Math.max(1,labPages().length)}</span><button type="button" class="btn" data-lab="next" aria-label="Další arch">›</button></span></div>

function labAction(act,b){
  const L=S.lab,i=+b.dataset.i;
  switch(act){
    case "plus":L.items[i].q++;labSave();render();break;
    case "minus":L.items[i].q=Math.max(0,L.items[i].q-1);labSave();render();break;
    case "del":L.items.splice(i,1);labSave();render();break;
    case "reset":delete L.names[L.items[i].cis];labSave();render();break;
    case "clear":if(!S.labConfClear){S.labConfClear=true;render();setTimeout(()=>{if(S.labConfClear){S.labConfClear=false;if(S.module==="stitky")render()}},4000);break}
      S.labConfClear=false;L.items=[];L.page=0;labSave();render();break;
    case "pasteOn":L.paste=true;render();requestAnimationFrame(()=>$("#labPaste")?.focus());break;
    case "pasteOff":L.paste=false;render();break;
    case "pasteGo":{const n=labParsePaste($("#labPaste").value);if(!n){toast("V textu jsem nenašel žádné zboží");break}L.paste=false;toast(`Přidáno ${n} ${n===1?"položka":n<5?"položky":"položek"}`);render();break}
    case "resClose":L.q="";L.res=null;$("#labq").value="";render();requestAnimationFrame(()=>$("#labq")?.focus());break;
    case "prev":if(L.page>0){L.page--;labRefresh()}break;
    case "next":if(L.page<labPages().length-1){L.page++;labRefresh()}break;
    case "print":labPrint();break;
  }
}
function labSearch(submit){
  const L=S.lab,q=fixScanner($("#labq")?.value||"");L.q=q;
  if(!q){L.res=null}
  else{const hit=lookupCode(q);
    if(submit&&hit.length===1){const r=S.catalog[hit[0]];labAdd(r[2],r[0]);toast("Přidáno: "+r[0]);L.q="";L.res=null;$("#labq").value="";render();requestAnimationFrame(()=>$("#labq")?.focus());return}
    L.res=hit.length?hit:searchText(q);
    if(submit&&L.res.length===1){const r=S.catalog[L.res[0]];labAdd(r[2],r[0]);toast("Přidáno: "+r[0]);L.q="";L.res=null;$("#labq").value="";render();requestAnimationFrame(()=>$("#labq")?.focus());return}
  }
  const el=$("#labRes");if(el)el.innerHTML=labResHtml();
}
/* PDF archu štítků (mobil): text vykreslený do obrázku 300 dpi (kvůli češtině a písmu Barlow),
   čárové kódy a čáry pro střih vektorově – přesné rozměry, A4 ve skutečné velikosti */
const JSPDF_URL="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
const labKey=()=>JSON.stringify([labPrintable(),S.lab.usedQ,S.lab.showNum]);
function labPdfBuild(){
  const pg=labPages(),DPI=300,k=DPI/25.4,W=Math.round(210*k),H=Math.round(297*k);
  const cv=document.createElement("canvas");cv.width=W;cv.height=H;const x=cv.getContext("2d");
  const pdf=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"portrait",compress:true});
  pg.forEach((slots,i)=>{
    const ops=LAB.layout(slots,S.lab.showNum);
    x.setTransform(1,0,0,1,0,0);x.fillStyle="#fff";x.fillRect(0,0,W,H);x.fillStyle="#000";x.textAlign="center";x.textBaseline="alphabetic";
    ops.forEach(o=>{if(o.t!=="t")return;
      x.font=(o.bold?'700 ':'500 ')+(o.size*0.35278*k).toFixed(2)+'px '+(o.bold?'"Barlow Condensed","Arial Narrow",sans-serif':'"Barlow",Arial,sans-serif');
      x.fillText(o.s,o.x*k,o.y*k)});
    if(i)pdf.addPage("a4","portrait");
    pdf.addImage(cv.toDataURL("image/jpeg",0.95),"JPEG",0,0,210,297,undefined,"FAST");
    pdf.setDrawColor(140,140,140);pdf.setLineWidth(0.2);
    ops.forEach(o=>{if(o.t==="l")pdf.line(o.x1,o.y1,o.x2,o.y2)});
    pdf.setFillColor(0,0,0);
    ops.forEach(o=>{if(o.t==="r")pdf.rect(o.x,o.y,o.w,o.h,"F")});
  });
  const d=new Date(),p2=n=>String(n).padStart(2,"0");
  return new File([pdf.output("blob")],`Stitky-${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}-${p2(d.getHours())}${p2(d.getMinutes())}.pdf`,{type:"application/pdf"});
}
function labPdfPreload(){if(MOBIL&&!window.jspdf)loadLib(JSPDF_URL).catch(()=>{})}
function labPdf(){
  if(!labPages().length)return;
  if(!window.jspdf){toast("Připravuji tisk, za chvilku klepněte znovu");loadLib(JSPDF_URL).catch(()=>toast("Nepodařilo se načíst – zkontrolujte internet"));return}
  const key=labKey();
  try{if(!S.lab.pdf||S.lab.pdfKey!==key){S.lab.pdf=labPdfBuild();S.lab.pdfKey=key}}
  catch(e){toast("PDF se nepodařilo vytvořit");return}
  const f=S.lab.pdf;
  if(mobilShare(f,"Štítky"))return;
  const u=URL.createObjectURL(f);window.open(u,"_blank");
}
function labPrint(){
  const pg=labPages();if(!pg.length)return;
  if(MOBIL){labPdf();return}
  let box=$("#labPrint");if(!box){box=document.createElement("div");box.id="labPrint";document.body.appendChild(box)}
  box.innerHTML=pg.map((s,i)=>`<div class="lpage">${LAB.svg(s,{preview:false,showNum:S.lab.showNum,usedQ:S.lab.usedQ,first:i===0})}</div>`).join("");
  document.body.classList.add("labprinting");
  setTimeout(()=>window.print(),60);
}
window.addEventListener("afterprint",()=>{document.body.classList.remove("labprinting","dlprinting");const b=$("#labPrint");if(b)b.innerHTML=""});
document.addEventListener("click",e=>{

  if(b.dataset.labq!=null){const q=+b.dataset.labq,u=S.lab.usedQ,i=u.indexOf(q);if(i>=0)u.splice(i,1);else u.push(q);S.lab.page=0;render();return}
  if(b.dataset.lab){labAction(b.dataset.lab,b);return}
});

let labT;document.addEventListener("input",e=>{

    e.target.classList.toggle("edited",S.lab.names[it.cis]!=null);const rb=e.target.parentNode.querySelector("[data-lab=reset]");if(rb)rb.hidden=S.lab.names[it.cis]==null;
    labSave();clearTimeout(labT);labT=setTimeout(labRefresh,150)}

  if(b.dataset.supact){supAction(b.dataset.supact,b.dataset.sup,b);return}
  if(b.dataset.dodb){const d=dlDraft(),o=odbOf(b.dataset.dodb);d.odb=b.dataset.dodb;d.odbN=o?o[1]:"";dlSaveDraft();S.dq="";S.current=null;render();window.scrollTo(0,0);return}
  if(b.dataset.dview){if(S.cam)camStop();S.dview=b.dataset.dview;S.dprint=null;S.dsel=null;S.dconf=null;if(S.dview==="new")S.dlDone=null;render();window.scrollTo(0,0);return}
  if(b.dataset.dfilt){S.dfilt=b.dataset.dfilt;S.dsel=null;S.dconf=null;render();return}
  if(b.dataset.dsel){S.dsel=S.dsel===b.dataset.dsel?null:b.dataset.dsel;S.dconf=null;render();return}
  if(b.dataset.dlact){dlAction(b.dataset.dlact,b.dataset.c);return}
  if(b.dataset.dprint){if(S.cam)camStop();S.dprint=b.dataset.dprint;render();window.scrollTo(0,0);return}

  if(b.dataset.who){S.loginName=b.dataset.who;S.loginMode="pin";S.loginMsg="";render();requestAnimationFrame(()=>$("#pinIn")&&$("#pinIn").focus());return}
  if(b.dataset.ovf){S.ovFilter=b.dataset.ovf;render();return}

      S.confirmDel=null;setQ(S.current,0);toast("Smazáno: "+itemName(S.current));afterSave();break}

document.addEventListener("submit",e=>{

  else if(f.id==="qtyForm"){const v=parseQ($("#qty").value);if(isNaN(v)||v===0){toast("Zadejte počet");return}addQ(S.current,v);afterSave()}

  else if(f.id==="unkForm"){const code=S.notFound;const n=$("#unkName").value.trim()||"Neznámé zboží";if(addQ("?"+code,1,{n,c:code})){S.notFound=null;S.query="";afterSave()}}
  else if(f.id==="setupForm"){

    catch(err){toast("Tohle není odkaz z tabulky. Musí obsahovat api= a k=.")}
  }
});
document.addEventListener("change",e=>{if(e.target.id==="fast"){S.fast=e.target.checked;store.set("fast",S.fast)}
